<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code For Fun - Goobles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 60px;
        }

        /* Heading with bold geometric letters */
        .heading {
            text-align: center;
            width: 100%;
        }

        h1 {
            font-size: clamp(3rem, 15vw, 10rem);
            font-weight: 900;
            color: #0099ff;
            letter-spacing: 8px;
            line-height: 1.1;
            text-transform: uppercase;
            font-family: 'Arial Black', sans-serif;
            word-spacing: 20px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Button container */
        .button-group {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        /* Buttons */
        .btn {
            padding: 18px 50px;
            font-size: 1.1rem;
            font-weight: 700;
            border: 4px solid #0099ff;
            background-color: #0099ff;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Arial Black', sans-serif;
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(0, 153, 255, 0.4);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-outline {
            background-color: transparent;
            color: #0099ff;
            border: 4px solid #0099ff;
        }

        .btn-outline:hover {
            background-color: #0099ff;
            color: white;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            h1 {
                font-size: clamp(2rem, 12vw, 4rem);
                letter-spacing: 4px;
                word-spacing: 10px;
            }

            .button-group {
                gap: 20px;
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
                padding: 16px 30px;
                font-size: 1rem;
            }

            .container {
                gap: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heading">
            <h1>CODE<br>FOR<br>FUN</h1>
        </div>
        
        <div class="button-group">
            <a href="https://guns.lol/goobles" class="btn" target="_blank">Guns.lol</a>
            <a href="https://youtube.com/@gooblesMC" class="btn btn-outline" target="_blank">YouTube</a>
        </div>
    </div>
</body>
</html>
